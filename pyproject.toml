[project]
name = "supplygraph-opme"
version = "0.1.0"
description = "Graph digital twin of a multi-tier OPME (orthopedic & cardiovascular implant) supply chain in Neo4j"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Cunha" }]
requires-python = ">=3.11"
dependencies = [
    "neo4j>=6.4.1,<7",
    "graphdatascience>=2.4,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13",
    "duckdb>=1.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "certifi>=2024.2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.45",
    "neo4j-viz>=1.13",
    "plotly>=6.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[project.scripts]
sgraph = "supplygraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplygraph"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", ".runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: tests that need a running Neo4j instance"]
