name: Aura keepalive

# AuraDB Free pauses after 72 h without activity and deletes an instance left paused for more than 30 days.
# A paused instance refuses connections, so a weekly query would always find it paused and could not wake it.
# Every 2 days keeps the gap under 72 h even across month ends (day-of-month 31 -> 1) and GitHub schedule delays.
# If the job fails, GitHub e-mails the failure: resume the instance at https://console.neo4j.io within 30 days.
# Note: GitHub disables scheduled workflows in public repos after 60 days without repository activity.
on:
  schedule:
    - cron: "17 9 */2 * *" # 09:17 UTC on days 1, 3, 5, ... of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0 (no floating major tags since v8)
      - name: Read query on AuraDB
        env:
          AURA_URI: ${{ secrets.AURA_URI }}
          AURA_USER: ${{ secrets.AURA_USER }}
          AURA_PASSWORD: ${{ secrets.AURA_PASSWORD }}
          AURA_DATABASE: ${{ secrets.AURA_DATABASE }}
          PYTHONPATH: src
        # only the libraries supplygraph.config/db need (same pins as app/requirements.txt), not the whole pipeline
        run: >-
          uv run --no-project --python 3.12
          --with neo4j==6.4.1 --with certifi==2026.11.20 --with pandas==3.1.1 --with numpy==2.5.5
          --with pydantic==2.14.4 --with python-dotenv==1.2.4 --with pyyaml==6.0.4
          python scripts/aura_keepalive.py
