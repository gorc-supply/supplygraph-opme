# Neo4j Community + APOC + Graph Data Science for local development.
# Versions pinned in docs/VERSIONS.md. Memory sized for a 16 GB notebook.
# Start:  sgraph up   (or: docker compose up -d)
services:
  neo4j:
    image: neo4j:2026.10.2-community
    container_name: supplygraph-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-local}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 2g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_db_transaction_timeout: 600s
    volumes:
      - neo4j-data:/data
      - ./data/generated:/import/generated:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:
